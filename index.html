<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Number Guessing Game</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 style="text-align:center" id="title">Guessing Game</h1>
    <p id="dates"></p>
    <h3>Name</h3>
    <input type="text" id="name" placeholder="first and last name">
    <button id="nameBtn">Name</button>
    <h3 id="welcome"></h3>
    <audio id="win" src="win.mp3"></audio>
    <audio id="lose" src="lose.mp3"></audio>
    <h3>Level</h3>
    <input type="radio" name="level" id="e" value="3" checked><label for="e">Easy</label>
    <input type="radio" name="level" id="m" value="10"><label for="m">Medium</label>
    <input type="radio" name="level" id="h" value="100"><label for="h">Hard</label>
    <input type="radio" name="level" id="i" value="1000"><label for="i">Impossible</label>


    <button id="playBtn">Play</button>

    <h3 id="msg">Select a Level</h3>
    <input type="text" id="guess">
    <button id="guessBtn" disabled>Guess</button>
    <button id="giveUp" disabled>Give Up</button>
    <br>
    <p id="timer">Time: </p>
    <p id="tries">Tries: 0</p>
    <h3>Stats</h3>
    <p id="wins">Total wins: 0</p>
    <p id="avgScore">Average Score: </p>
    <p id="besttime"></p>
    <p id="totaltime"></p>
    <p id="avgtime"></p>
    <h3>Leaderboard</h3>
    <ol>
      <li name="leaderboard">100</li>
      <li name="leaderboard">100</li>
      <li name="leaderboard">100</li>
    </ol>
  </body>
</html>
